format:
  datapage-html:
    theme: theme.scss
    mainfont: "Helvetica Neue, Helvetica, Arial, sans-serif"
    fontsize: 15px
    include-in-header:
      - text: |
          <script>
          // The Observable runtime schedules on requestAnimationFrame, which
          // never fires in hidden documents (prerendering, preview panes,
          // automation) -- OJS cells then hang forever with no error. If the
          // page LOADS hidden, fall back to a timer-based scheduler.
          if (document.visibilityState === "hidden") {
            window.requestAnimationFrame = (cb) => setTimeout(() => cb(performance.now()), 16);
          }
          </script>

execute:
  echo: false
  message: false
  warning: false
  error: false
